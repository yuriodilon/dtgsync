plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'br.gov.sp.prefeitura.gcm.dtgsync'
    compileSdk 34

    defaultConfig {
        applicationId 'br.gov.sp.prefeitura.gcm.dtgsync'
        minSdk 26 // Android 8.0 Oreo (compatível com toda a linha DJI Smart Controller Enterprise e RC Plus)
        targetSdk 34
        versionCode 3
        versionName '1.1.1'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // WorkManager: Execução em segundo plano tolerante a reinicializações e quedas de rede
    implementation 'androidx.work:work-runtime-ktx:2.9.0'

    // WireGuard Tunnel: VPN nativa de sistema de altíssima performance para todo o rádio
    implementation 'com.wireguard.android:tunnel:1.0.20230706'

    // OkHttp: Cliente HTTP robusto para upload de arquivos grandes com multipart e download OTA
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // Gson: Serialização e deserialização JSON de configurações locais
    implementation 'com.google.code.gson:gson:2.10.1'

    // Corrotinas Kotlin
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}
